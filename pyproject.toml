[tool.poetry]
name = "google-maps-scraper"
version = "0.1.0"
description = "Production-ready web scraping and lead generation project for Google Maps"
authors = ["Antigravity <antigravity@google.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = "^2.0.27"
asyncpg = "^0.30.0"
alembic = "^1.13.1"
playwright = "^1.41.2"
playwright-stealth = "^1.0.6"
openai = "^1.12.0"
pydantic-settings = "^2.1.0"
pandas = "^2.2.0"
openpyxl = "^3.1.2"
python-dotenv = "^1.0.1"
rich = "^13.7.0"
setuptools = "^82.0.0"
requests = "^2.32.5"
streamlit = "^1.54.0"
xlsxwriter = "^3.2.9"
beautifulsoup4 = "^4.14.3"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
isort = "^5.13.2"
pytest = "^8.0.1"
pytest-asyncio = "^0.23.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
